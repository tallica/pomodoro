name: CI

# A `v*` tag runs the same checks as master and releases only if they pass.
# macOS runners only: menuet wraps AppKit through cgo, so nothing builds
# anywhere else.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: go test -race ./...
      - run: make bundle

  audit:
    uses: ./.github/workflows/vuln.yml

  release:
    needs: [test, audit]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the app version comes from git describe
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - run: make bundle
      - run: ditto -c -k --keepParent Pomodoro.app "Pomodoro-$GITHUB_REF_NAME-macos.zip"
      - run: gh release create "$GITHUB_REF_NAME" "Pomodoro-$GITHUB_REF_NAME-macos.zip" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
