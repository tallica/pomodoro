name: vuln

# govulncheck reports only vulnerabilities the code can reach. Weekly as
# well as from CI: an advisory can land with nothing here changing.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call: # ci.yml runs it on every push, PR and tag

permissions:
  contents: read

jobs:
  govulncheck:
    # macOS, so the cgo AppKit code is part of what gets checked.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make audit
