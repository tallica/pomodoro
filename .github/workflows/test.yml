name: test

# macOS runners only: menuet wraps AppKit through cgo, so nothing builds
# anywhere else.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # release.yml runs it against the tagged commit

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: go test -race ./...
      - run: make bundle
